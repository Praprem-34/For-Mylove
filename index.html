<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ถึงคนพิเศษของเรา 💕</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
    color: #5a4050;
}

/* =========================
   หน้าต่างแต่ละหน้า
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
}

/* =========================
   หน้าแรก
========================= */

.start-content {
    text-align: center;
}

.start-content h1 {
    font-size: 2.3rem;
    margin-bottom: 12px;
}

.start-content p {
    font-size: 1.1rem;
    margin-bottom: 35px;
}

/* =========================
   กล่องของขวัญ
========================= */

.gift {
    position: relative;
    width: 170px;
    height: 150px;
    margin: 20px auto 40px;
    cursor: pointer;
    transition: transform 0.3s;
}

.gift:hover {
    transform: scale(1.05);
}

.box {
    position: absolute;
    bottom: 0;
    width: 170px;
    height: 115px;
    background: #ff8fb8;
    border-radius: 8px;
    box-shadow: 0 15px 30px rgba(150, 80, 110, 0.25);
}

.box::before {
    content: "";
    position: absolute;
    left: 65px;
    width: 40px;
    height: 115px;
    background: #ffd166;
}

.lid {
    position: absolute;
    top: 25px;
    left: -8px;
    width: 186px;
    height: 38px;
    background: #ff72a3;
    border-radius: 8px;
    transition: transform 0.8s ease;
    z-index: 3;
}

.lid::before {
    content: "";
    position: absolute;
    left: 73px;
    width: 40px;
    height: 38px;
    background: #ffd166;
}

/* โบว์ */

.bow-left,
.bow-right {
    position: absolute;
    top: 0;
    width: 45px;
    height: 35px;
    background: #ffd166;
    border-radius: 50%;
    z-index: 4;
}

.bow-left {
    left: 45px;
    transform: rotate(30deg);
}

.bow-right {
    right: 45px;
    transform: rotate(-30deg);
}

.bow-center {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #ffbd35;
    border-radius: 50%;
    top: 10px;
    left: 74px;
    z-index: 5;
}

/* ตอนเปิดกล่อง */

.gift.open .lid {
    transform: translateY(-85px) rotate(-8deg);
}

.gift.open {
    animation: giftOpen 0.8s ease;
}

@keyframes giftOpen {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* =========================
   ปุ่ม
========================= */

.main-btn {
    border: none;
    padding: 15px 35px;
    border-radius: 50px;
    background: #ff72a3;
    color: white;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 114, 163, 0.3);
    transition: 0.3s;
}

.main-btn:hover {
    transform: translateY(-3px);
}

/* =========================
   หน้ารหัส
========================= */

.password-card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.9);
    padding: 35px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(100,60,100,0.2);
}

.password-card h2 {
    font-size: 1.8rem;
    margin-bottom: 10px;
}

.password-card p {
    margin-bottom: 25px;
}

.password-input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ffc0d5;
    border-radius: 15px;
    outline: none;
    text-align: center;
    font-size: 1.3rem;
    letter-spacing: 8px;
    margin-bottom: 15px;
}

.password-input:focus {
    border-color: #ff72a3;
}

/* ข้อความผิด */

.error {
    color: #e75480;
    margin-top: 15px;
    min-height: 25px;
}

/* เขย่ากล่อง */

.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

/* =========================
   หน้าเมนู (เตรียมไว้)
========================= */

.menu-card {
    text-align: center;
}

.menu-card h2 {
    margin-bottom: 20px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    max-width: 400px;
}

.menu-item {
    background: white;
    padding: 30px 15px;
    border-radius: 20px;
    font-size: 2rem;
    box-shadow: 0 8px 20px rgba(100,60,100,0.15);
}

.menu-item span {
    display: block;
    font-size: 0.9rem;
    margin-top: 8px;
}

/* มือถือ */

@media (max-width: 500px) {

    .start-content h1 {
        font-size: 1.8rem;
    }

    .gift {
        transform: scale(0.9);
    }

    .gift:hover {
        transform: scale(0.95);
    }
}
</style>
</head>

<body>

<!-- =================================
     หน้าแรก
================================= -->

<section id="startScreen" class="screen active">

    <div class="start-content">

        <h1>🎀 ถึงคนพิเศษของเรา 🎀</h1>

        <p>
            มีของขวัญเล็ก ๆ รอคุณอยู่...
            <br>
            เปิดดูสิ 💕
        </p>

        <div class="gift" id="gift" onclick="openGift()">

            <div class="bow-left"></div>
            <div class="bow-right"></div>
            <div class="bow-center"></div>

            <div class="lid"></div>
            <div class="box"></div>

        </div>

        <button class="main-btn" onclick="openGift()">
            🎁 เปิดของขวัญ
        </button>

    </div>

</section>


<!-- =================================
     หน้ารหัสผ่าน
================================= -->

<section id="passwordScreen" class="screen">

    <div class="password-card" id="passwordCard">

        <h2>🔐 รหัสลับของเรา</h2>

        <p>
            จำรหัสนี้ได้ไหม? 👀
            <br>
            <small>Hint: วันที่สำคัญของเรา 💕</small>
        </p>

        <input
            type="password"
            id="passwordInput"
            class="password-input"
            maxlength="10"
            placeholder="••••"
        >

        <button class="main-btn" onclick="checkPassword()">
            💗 ยืนยัน
        </button>

        <div class="error" id="errorMessage"></div>

    </div>

</section>


<!-- =================================
     หน้าเมนู
================================= -->

<section id="menuScreen" class="screen">

    <div class="menu-card">

        <h2>💕 ยินดีต้อนรับ 💕</h2>

        <p style="margin-bottom:25px;">
            คุณเปิดประตูเข้ามาได้แล้ว!
        </p>

        <div class="menu-grid">

            <div class="menu-item">
                💌
                <span>จดหมายถึงเธอ</span>
            </div>

            <div class="menu-item">
                📖
                <span>เรื่องราวของเรา</span>
            </div>

            <div class="menu-item">
                🎮
                <span>เกมของเรา</span>
            </div>

            <div class="menu-item">
                📸
                <span>ความทรงจำ</span>
            </div>

        </div>

    </div>

</section>


<script>

/* =================================
   ตั้งรหัสผ่าน
================================= */

const correctPassword = "1404";


/* =================================
   เปิดกล่องของขวัญ
================================= */

function openGift() {

    const gift = document.getElementById("gift");

    gift.classList.add("open");

    // รอ animation ก่อนเปลี่ยนหน้า
    setTimeout(() => {

        document.getElementById("startScreen")
            .classList.remove("active");

        document.getElementById("passwordScreen")
            .classList.add("active");

        document.getElementById("passwordInput").focus();

    }, 900);
}


/* =================================
   ตรวจสอบรหัส
================================= */

function checkPassword() {

    const input =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("errorMessage");

    const card =
        document.getElementById("passwordCard");


    if (input === correctPassword) {

        error.textContent = "🎉 ถูกต้อง!";

        setTimeout(() => {

            document.getElementById("passwordScreen")
                .classList.remove("active");

            document.getElementById("menuScreen")
                .classList.add("active");

        }, 700);

    } else {

        error.textContent =
            "❌ รหัสไม่ถูกนะ ลองใหม่อีกครั้ง 💕";

        card.classList.remove("shake");

        // ทำให้ animation เล่นซ้ำ
        void card.offsetWidth;

        card.classList.add("shake");

        document.getElementById("passwordInput").value = "";

    }
}


/* =================================
   กด Enter เพื่อส่งรหัส
================================= */

document.getElementById("passwordInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });

</script>

</body>
</html>
